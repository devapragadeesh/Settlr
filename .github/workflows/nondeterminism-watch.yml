name: Nondeterminism watch

on:
  push:
  pull_request:

# Runs test_every_outcome_round_trips_losslessly on its own, every push --
# deselected from the main CI badge (.github/workflows/ci.yml) because it is
# a real, already-tracked resolver-timing property, not a bug this workflow
# introduced: investigation/resolver_nondeterminism/, DECISIONS.md Sec.58/67.
# Separating it keeps that badge honest about the code paths it actually
# gates, without hiding the finding -- this workflow's own status is public
# and this comment says exactly why a red run here does not mean the repo
# is broken.

jobs:
  resolver-round-trip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r requirements-service.txt
      - name: store/ -- the one round-trip test under known CPU-contention nondeterminism
        run: pytest store/tests/test_codec.py::test_every_outcome_round_trips_losslessly -q
